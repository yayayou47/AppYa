# Publication d'une version : à chaque tag « vX.Y.Z », construit
#   - AppYa-ubuntu-X.Y.Z.zip  (version ordinateur, carnet vide : bash installer.sh)
#   - AppYa-X.Y.Z.apk         (Android, version autonome, signée)
# et les attache à la page « Releases ». Lancement manuel possible (APK de test, sans publication).
name: Publier une version (APK et Ubuntu)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Aucune donnée personnelle dans le dépôt
        run: bash outils/verifier-depot.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Numéro de version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.$GITHUB_RUN_NUMBER"; fi
          IFS=. read -r MA MI PA <<< "$V"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # numéro interne Android toujours croissant (la v3.3.0 avait 30300 ; Ousnou 1.0.0 repart à 1.0.0)
          echo "CODE=$(( 100000 + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
          echo "NOMVER=$(sed -n 's/^VERSION_NOM = "\(.*\)".*/\1/p' serveur.py)" >> "$GITHUB_ENV"
      - name: Version ordinateur (zip Ubuntu)
        run: |
          mkdir -p dist/AppYa/donnees
          cp -r app serveur.py appya installer.sh desinstaller.sh LISEZMOI.txt dist/AppYa/
          (cd dist && zip -qr "AppYa-ubuntu-$VERSION.zip" AppYa && rm -rf AppYa)
      - name: Version autonome et projet Android
        run: |
          bash outils/construire-web.sh www
          npm ci
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1f4e79' --iconBackgroundColorDark '#1f4e79' --splashBackgroundColor '#1f4e79' --splashBackgroundColorDark '#1f4e79'
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx cap sync android
      - name: Construction de l'APK
        run: cd android && ./gradlew --no-daemon assembleRelease
      - name: Signature de l'APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE absent : APK non signé (test seulement, non installable)."
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/AppYa-$VERSION-non-signe.apk"; exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/appya.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligne.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/appya.jks" --ks-key-alias appya \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "dist/AppYa-$VERSION.apk" "$RUNNER_TEMP/aligne.apk"
          "$BT/apksigner" verify --print-certs "dist/AppYa-$VERSION.apk" | head -n 3
          rm -f "$RUNNER_TEMP/appya.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: AppYa-${{ env.VERSION }}
          path: dist/
      - name: Page « Releases »
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/AppYa-"$VERSION".apk >/dev/null || { echo "::error::APK signé absent : secrets ANDROID_KEYSTORE* à définir."; exit 1; }
          cat > notes.md <<NOTES
          **AppYa $NOMVER $VERSION** : suivi financier, véhicule et maison. Aucune donnée n'est incluse : chaque personne commence avec un carnet vide.

          - **Android** : \`AppYa-$VERSION.apk\` (autoriser l'installation depuis cette source la première fois). Les données restent dans le téléphone : pensez à *Données et réglages › Sauvegarde*.
          - **Ordinateur Ubuntu** : \`AppYa-ubuntu-$VERSION.zip\`, décompresser puis \`bash installer.sh\`.
          - **Lien web** (sans installation) : https://yayayou47.github.io/AppYa/
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "AppYa $NOMVER $VERSION" --notes-file notes.md
